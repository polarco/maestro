name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version and channel
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match desktop version ${version}." >&2
            exit 1
          fi

          if [[ "${version}" == *-beta.* ]]; then
            channel="beta"
            prerelease="true"
          elif [[ "${version}" == *-* ]]; then
            echo "Only stable and beta versions are supported: ${version}." >&2
            exit 1
          else
            channel="stable"
            prerelease="false"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsecret-1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:e2e

  package:
    name: Package ${{ matrix.platform }}
    needs: [prepare, quality]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsecret-1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package stable channel
        if: needs.prepare.outputs.channel == 'stable'
        run: pnpm package:${{ matrix.platform }}

      - name: Package beta channel
        if: needs.prepare.outputs.channel == 'beta'
        run: pnpm package:${{ matrix.platform }}:beta

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/Maestro-*
            release/*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=(--repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes)
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "Maestro ${RELEASE_VERSION}" "${flags[@]}"
